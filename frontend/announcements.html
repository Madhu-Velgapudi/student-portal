<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Announcements — Student Portal</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .ann-list { display: flex; flex-direction: column; gap: 0.75rem; max-width: 760px; }
    .ann-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.3rem 1.6rem;
      box-shadow: var(--shadow-sm); animation: fadeUp 0.3s ease;
      transition: box-shadow 0.2s;
    }
    .ann-card:hover { box-shadow: var(--shadow); }
    .ann-card.normal   { border-left: 3px solid var(--accent); }
    .ann-card.important{ border-left: 3px solid var(--gold); }
    .ann-card.urgent   { border-left: 3px solid var(--red); }
    .ann-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 0.6rem; }
    .ann-title { font-family: var(--font-head); font-weight: 700; font-size: 1rem; color: var(--ink); }
    .ann-priority {
      font-size: 0.68rem; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
    }
    .priority-normal    { background: var(--accent-light); color: var(--accent); }
    .priority-important { background: var(--gold-light); color: var(--gold); }
    .priority-urgent    { background: var(--red-light); color: var(--red); }
    .ann-message { font-size: 0.88rem; color: var(--ink2); line-height: 1.65; }
    .ann-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border); }
    .ann-by   { font-size: 0.75rem; color: var(--muted); }
    .ann-date { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <a href="dashboard.html" class="nav-logo"><div class="nav-logo-mark">SP</div>StudentPortal</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="courses.html">Courses</a>
      <a href="timetable.html">Timetable</a>
      <a href="attendance.html">Attendance</a>
      <a href="exams.html">Exams</a>
      <a href="assignments.html">Assignments</a>
      <a href="fees.html">Fees</a>
      <a href="gpa.html">GPA</a>
    </div>
    <div class="nav-right">
      <a href="announcements.html" style="text-decoration:none;padding:6px 10px;border-radius:var(--radius-sm);color:var(--accent);background:var(--accent-light);font-size:1.1rem;" title="Announcements">📢</a>
      <a href="notifications.html" style="text-decoration:none;padding:6px 10px;border-radius:var(--radius-sm);color:var(--muted);font-size:1.1rem;">🔔</a>
      <a href="profile.html" style="text-decoration:none;">
        <div class="nav-user">
          <div class="nav-avatar" id="navAvatar">S</div>
          <span class="nav-username" id="navName">Student</span>
        </div>
      </a>
      <button class="btn-logout" onclick="logout()">Log out</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Announcements</h1>
        <p>Important notices from your institution.</p>
      </div>
    </div>
    <div id="annContainer">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireAuth();
    async function load() {
      const user = await fetchUser();
      if (user) {
        const fn = user.name.split(" ")[0];
        document.getElementById("navName").textContent   = fn;
        document.getElementById("navAvatar").textContent = fn[0].toUpperCase();
      }

      const res   = await fetch(`${API}/announcements/`, {
        headers: { "Authorization": "Bearer " + getToken() }
      });
      const items = await res.json();
      const el    = document.getElementById("annContainer");

      if (!items.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-icon">📢</div><h3>No announcements yet</h3><p>Check back later for updates.</p></div>`;
        return;
      }

      el.innerHTML = `<div class="ann-list">${items.map(a => `
        <div class="ann-card ${a.priority}">
          <div class="ann-header">
            <div class="ann-title">${a.title}</div>
            <span class="ann-priority priority-${a.priority}">${a.priority}</span>
          </div>
          <div class="ann-message">${a.message}</div>
          <div class="ann-footer">
            <div class="ann-by">— ${a.posted_by}</div>
            <div class="ann-date">${a.created_at}</div>
          </div>
        </div>`).join("")}</div>`;
    }
    load();
  </script>
</body>
</html>
