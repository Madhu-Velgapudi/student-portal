<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GPA — Student Portal</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .gpa-hero {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 2rem;
      box-shadow: var(--shadow-sm); margin-bottom: 2rem;
      display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 1rem;
    }
    .gpa-stat { text-align: center; padding: 1rem; }
    .gpa-stat .val {
      font-family: var(--font-head); font-size: 2.5rem;
      font-weight: 800; letter-spacing: -2px; line-height: 1;
    }
    .gpa-stat .lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 0.4rem; }
    .marks-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .marks-table th { font-family: var(--font-head); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.6px; padding: 12px 16px; background: var(--bg2); color: var(--muted); text-align: left; border-bottom: 2px solid var(--border); }
    .marks-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    .marks-table tr:last-child td { border-bottom: none; }
    .marks-table tr:hover td { background: var(--bg2); }
    .grade-badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; font-family: var(--font-head); }
    .grade-S { background: #e6f4ed; color: #1a7a4a; }
    .grade-A { background: #e8eefb; color: #2d5be3; }
    .grade-B { background: #fdf6e3; color: #b5861a; }
    .grade-C { background: #fff3e0; color: #e65100; }
    .grade-D { background: #fde8e8; color: #c0392b; }
    .grade-F { background: #fdf0ee; color: #e63946; }
    .marks-bar { height: 6px; background: var(--bg2); border-radius: 3px; margin-top: 4px; width: 120px; }
    .marks-bar-fill { height: 100%; border-radius: 3px; }
    .info-banner { background: var(--accent-light); border: 1px solid #c5d5f8; border-radius: var(--radius); padding: 1rem 1.2rem; margin-bottom: 1.5rem; font-size: 0.88rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .cgpa-color-excellent { color: #1a7a4a; }
    .cgpa-color-good      { color: #2d5be3; }
    .cgpa-color-average   { color: #b5861a; }
    .cgpa-color-low       { color: #c0392b; }
    @media(max-width:768px){ .gpa-hero { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <nav>
    <a href="dashboard.html" class="nav-logo"><div class="nav-logo-mark">SP</div>StudentPortal</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="courses.html">Courses</a>
      <a href="timetable.html">Timetable</a>
      <a href="attendance.html">Attendance</a>
      <a href="gpa.html" class="active">GPA</a>
    </div>
    <div class="nav-right">
      <a href="announcements.html" style="text-decoration:none;padding:6px 10px;border-radius:var(--radius-sm);color:var(--muted);font-size:1.1rem;">📢</a>
      <a href="notifications.html" style="text-decoration:none;padding:6px 10px;border-radius:var(--radius-sm);color:var(--muted);font-size:1.1rem;">🔔</a>
      <a href="profile.html" style="text-decoration:none;">
        <div class="nav-user">
          <div class="nav-avatar" id="navAvatar">S</div>
          <span class="nav-username" id="navName">Student</span>
        </div>
      </a>
      <button class="btn-logout" onclick="logout()">Log out</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div class="page-header-left">
        <h1>My GPA</h1>
        <p>Your academic performance overview.</p>
      </div>
    </div>

    <div class="info-banner">
      ℹ️ Marks are entered by your teacher. Contact your teacher if you find any discrepancy.
    </div>

    <div id="gpaContainer">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/gpa.js"></script>
  <script>
    requireAuth();
    loadMyGPA();
  </script>
</body>
</html>
