<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exam Timetable — Student Portal</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .exam-grid { display: flex; flex-direction: column; gap: 0.75rem; max-width: 800px; }
    .exam-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.2rem 1.5rem;
      box-shadow: var(--shadow-sm); display: flex;
      align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap; animation: fadeUp 0.3s ease;
      transition: box-shadow 0.2s;
    }
    .exam-card:hover { box-shadow: var(--shadow); }
    .exam-card.upcoming { border-left: 3px solid var(--accent); }
    .exam-card.today    { border-left: 3px solid var(--red); background: #fff8f8; }
    .exam-card.past     { border-left: 3px solid var(--border2); opacity: 0.7; }
    .exam-left { flex: 1; }
    .exam-code { font-size: 0.7rem; color: var(--accent); font-weight: 700; background: var(--accent-light); padding: 2px 8px; border-radius: 4px; }
    .exam-name { font-family: var(--font-head); font-weight: 700; font-size: 1rem; margin: 0.4rem 0 0.2rem; }
    .exam-type-badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 0.5rem;
    }
    .type-midterm  { background: #fdf6e3; color: #b5861a; }
    .type-final    { background: #fde8e8; color: #c0392b; }
    .type-quiz     { background: #e8eefb; color: #2d5be3; }
    .type-practical{ background: #e6f4ed; color: #1a7a4a; }
    .exam-meta { display: flex; gap: 1rem; font-size: 0.82rem; color: var(--muted); flex-wrap: wrap; }
    .exam-right { text-align: right; flex-shrink: 0; }
    .countdown {
      font-family: var(--font-head); font-size: 1.1rem; font-weight: 800;
      color: var(--accent);
    }
    .countdown.urgent { color: var(--red); }
    .countdown.past   { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
    .exam-date { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .marks-badge {
      display: inline-block; background: var(--gold-light); color: var(--gold);
      border: 1px solid #ead9a0; border-radius: 4px; padding: 2px 8px;
      font-size: 0.75rem; font-weight: 700; margin-top: 4px;
    }
    .section-divider {
      font-family: var(--font-head); font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted);
      padding: 0.5rem 0; margin-top: 1rem; border-bottom: 1px solid var(--border);
      margin-bottom: 0.8rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="dashboard.html" class="nav-logo"><div class="nav-logo-mark">SP</div>StudentPortal</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="courses.html">Courses</a>
      <a href="timetable.html">Timetable</a>
      <a href="attendance.html">Attendance</a>
      <a href="exams.html" class="active">Exams</a>
      <a href="assignments.html">Assignments</a>
      <a href="fees.html">Fees</a>
      <a href="gpa.html">GPA</a>
    </div>
    <div class="nav-right">
      <a href="announcements.html" style="text-decoration:none;padding:6px 10px;border-radius:var(--radius-sm);color:var(--muted);font-size:1.1rem;">📢</a>
      <a href="notifications.html" style="text-decoration:none;padding:6px 10px;border-radius:var(--radius-sm);color:var(--muted);font-size:1.1rem;">🔔</a>
      <a href="profile.html" style="text-decoration:none;">
        <div class="nav-user">
          <div class="nav-avatar" id="navAvatar">S</div>
          <span class="nav-username" id="navName">Student</span>
        </div>
      </a>
      <button class="btn-logout" onclick="logout()">Log out</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Exam Timetable</h1>
        <p>Your upcoming and past examinations.</p>
      </div>
    </div>
    <div id="examContainer">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireAuth();

    async function loadExams() {
      const user = await fetchUser();
      if (user) {
        const fn = user.name.split(" ")[0];
        document.getElementById("navName").textContent   = fn;
        document.getElementById("navAvatar").textContent = fn[0].toUpperCase();
      }

      const res   = await fetch(`${API}/exams/my`, {
        headers: { "Authorization": "Bearer " + getToken() }
      });
      const exams = await res.json();
      const el    = document.getElementById("examContainer");

      if (!exams.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><h3>No exams scheduled</h3><p>Your teacher hasn't scheduled any exams yet.</p></div>`;
        return;
      }

      const today    = new Date().toISOString().split("T")[0];
      const upcoming = exams.filter(e => e.date >= today);
      const past     = exams.filter(e => e.date < today);

      let html = "";

      if (upcoming.length) {
        html += `<div class="section-divider">📅 Upcoming Exams (${upcoming.length})</div><div class="exam-grid">`;
        html += upcoming.map(e => examCardHTML(e, today)).join("");
        html += `</div>`;
      }

      if (past.length) {
        html += `<div class="section-divider" style="margin-top:2rem;">✅ Past Exams (${past.length})</div><div class="exam-grid">`;
        html += past.map(e => examCardHTML(e, today)).join("");
        html += `</div>`;
      }

      el.innerHTML = html;
    }

    function examCardHTML(exam, today) {
      const examDate  = new Date(exam.date);
      const todayDate = new Date(today);
      const diffDays  = Math.ceil((examDate - todayDate) / (1000 * 60 * 60 * 24));

      let status    = "upcoming";
      let countdown = "";
      if (exam.date === today) {
        status    = "today";
        countdown = `<div class="countdown urgent">TODAY!</div>`;
      } else if (exam.date < today) {
        status    = "past";
        countdown = `<div class="countdown past">Completed</div>`;
      } else if (diffDays <= 3) {
        countdown = `<div class="countdown urgent">In ${diffDays} day${diffDays > 1 ? "s" : ""}</div>`;
      } else {
        countdown = `<div class="countdown">In ${diffDays} days</div>`;
      }

      return `
        <div class="exam-card ${status}">
          <div class="exam-left">
            <span class="exam-code">${exam.course_code}</span>
            <div class="exam-name">${exam.course_name}</div>
            <span class="exam-type-badge type-${exam.exam_type}">${exam.exam_type}</span>
            <div class="exam-meta">
              <span>📅 ${exam.date}</span>
              <span>⏰ ${exam.start_time}${exam.end_time ? " – " + exam.end_time : ""}</span>
              <span>🏛 ${exam.room}</span>
            </div>
          </div>
          <div class="exam-right">
            ${countdown}
            <div class="exam-date">${new Date(exam.date).toLocaleDateString("en-IN", {weekday:"long", day:"numeric", month:"short"})}</div>
            <div class="marks-badge">Max: ${exam.total_marks} marks</div>
          </div>
        </div>`;
    }

    loadExams();
  </script>
</body>
</html>
