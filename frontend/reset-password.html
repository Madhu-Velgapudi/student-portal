<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Student Portal</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-left">
      <div class="auth-brand">
        <div class="auth-brand-mark">SP</div>
        <span class="auth-brand-name">StudentPortal</span>
      </div>
      <div class="auth-left-content">
        <h2>Create a new<br/><span>strong</span><br/>password.</h2>
        <p>Choose a password that's at least 6 characters long and easy for you to remember.</p>
      </div>
      <div class="auth-features">
        <div class="auth-feature"><div class="auth-feature-icon">🔑</div>Minimum 6 characters</div>
        <div class="auth-feature"><div class="auth-feature-icon">🔒</div>Securely encrypted</div>
        <div class="auth-feature"><div class="auth-feature-icon">✅</div>One-time reset link</div>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <h1>New Password</h1>
        <p class="sub">Enter your new password below.</p>

        <div class="alert alert-error"   id="errMsg"></div>
        <div class="alert alert-success" id="successMsg"></div>

        <div id="formSection">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password"/>
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat new password" autocomplete="new-password"/>
          </div>
          <button class="btn btn-primary" id="submitBtn" onclick="resetPassword()">Reset Password →</button>
        </div>

        <div class="auth-footer">
          <a href="login.html">← Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
const token = new URLSearchParams(window.location.search).get("token");

    if (!token) {
      document.getElementById("errMsg").textContent = "Invalid reset link. Please request a new one.";
      document.getElementById("errMsg").classList.add("show");
      document.getElementById("formSection").style.display = "none";
    }

    async function resetPassword() {
      const btn      = document.getElementById("submitBtn");
      const password = document.getElementById("password").value;
      const confirm  = document.getElementById("confirmPassword").value;
      clearAlerts();

      if (!password || !confirm) { showErr("Both fields are required."); return; }
      if (password.length < 6)   { showErr("Password must be at least 6 characters."); return; }
      if (password !== confirm)   { showErr("Passwords do not match."); return; }

      btn.disabled    = true;
      btn.textContent = "Resetting...";

      try {
        const res  = await fetch(`${API}/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (res.ok) {
          showSuccess(data.message + " Redirecting to login...");
          document.getElementById("formSection").style.display = "none";
          setTimeout(() => window.location.href = "login.html", 2500);
        } else {
          showErr(data.error || "Reset failed.");
          btn.disabled    = false;
          btn.textContent = "Reset Password →";
        }
      } catch {
        showErr("Cannot connect to server.");
        btn.disabled    = false;
        btn.textContent = "Reset Password →";
      }
    }

    function showErr(msg) {
      const el = document.getElementById("errMsg");
      el.textContent = msg; el.classList.add("show");
    }
    function showSuccess(msg) {
      const el = document.getElementById("successMsg");
      el.textContent = msg; el.classList.add("show");
    }
    function clearAlerts() {
      document.querySelectorAll(".alert").forEach(el => el.classList.remove("show"));
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") resetPassword();
    });
  </script>
</body>
</html>
