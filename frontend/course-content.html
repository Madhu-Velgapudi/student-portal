<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course Content — Student Portal</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 0.85rem;
      font-weight: 600; margin-bottom: 1.5rem; transition: color 0.15s;
    }
    .back-btn:hover { color: var(--accent); }

    .course-hero {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.8rem 2rem;
      margin-bottom: 2rem; box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
    }
    .course-hero-left h1 { font-family: var(--font-head); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
    .course-hero-left p  { color: var(--muted); font-size: 0.88rem; margin-top: 0.3rem; }
    .course-hero-badges  { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.8rem; }
    .hero-badge {
      font-size: 0.75rem; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; display: inline-flex; align-items: center; gap: 4px;
    }
    .badge-code    { background: var(--accent-light); color: var(--accent); }
    .badge-dept    { background: var(--bg2); color: var(--muted); }
    .badge-credits { background: var(--gold-light); color: var(--gold); }

    /* CONTENT TABS */
    .content-tabs {
      display: flex; gap: 0; margin-bottom: 2rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 3px; width: fit-content;
      box-shadow: var(--shadow-sm);
    }
    .content-tab {
      padding: 8px 22px; border-radius: 4px; border: none;
      background: transparent; color: var(--muted);
      font-family: var(--font-head); font-size: 0.85rem;
      font-weight: 600; cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .content-tab.active { background: var(--accent); color: white; }
    .content-tab:not(.active):hover { color: var(--ink); background: var(--bg2); }
    .tab-badge {
      background: rgba(255,255,255,0.3); color: white;
      font-size: 0.65rem; padding: 1px 5px; border-radius: 10px; font-weight: 700;
    }
    .content-tab:not(.active) .tab-badge { background: var(--border); color: var(--muted); }

    .content-section { display: none; }
    .content-section.active { display: block; }

    /* SYLLABUS */
    .syllabus-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .syllabus-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.1rem 1.4rem;
      display: flex; align-items: flex-start; gap: 1.2rem;
      box-shadow: var(--shadow-sm); transition: box-shadow 0.2s;
      animation: fadeUp 0.3s ease;
    }
    .syllabus-item:hover { box-shadow: var(--shadow); }
    .week-badge {
      min-width: 52px; height: 52px; background: var(--accent-light);
      border-radius: var(--radius-sm); display: flex; flex-direction: column;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .week-label { font-size: 0.6rem; color: var(--accent); font-weight: 700; text-transform: uppercase; }
    .week-num   { font-family: var(--font-head); font-size: 1.3rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .syllabus-topic { font-family: var(--font-head); font-weight: 700; font-size: 0.95rem; color: var(--ink); }
    .syllabus-desc  { font-size: 0.83rem; color: var(--muted); margin-top: 0.3rem; line-height: 1.5; }

    /* MATERIALS */
    .materials-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .material-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.2rem;
      box-shadow: var(--shadow-sm); transition: all 0.2s;
      animation: fadeUp 0.3s ease; display: flex; flex-direction: column;
    }
    .material-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
    .material-type-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; margin-bottom: 0.8rem;
    }
    .type-link  { background: #e8f4fd; }
    .type-note  { background: #fef9e7; }
    .type-video { background: #fde8e8; }
    .type-pdf   { background: #fde8f4; }
    .material-title { font-family: var(--font-head); font-weight: 700; font-size: 0.95rem; color: var(--ink); margin-bottom: 0.3rem; }
    .material-desc  { font-size: 0.8rem; color: var(--muted); line-height: 1.5; flex: 1; }
    .material-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--border); }
    .material-meta  { font-size: 0.72rem; color: var(--muted); }
    .btn-open-material {
      padding: 5px 12px; background: var(--accent); color: white;
      border: none; border-radius: 5px; font-size: 0.75rem;
      font-weight: 700; cursor: pointer; text-decoration: none;
      font-family: var(--font-head); transition: all 0.15s; display: inline-block;
    }
    .btn-open-material:hover { background: var(--accent-dark); }

    /* ANNOUNCEMENTS */
    .announcements-list { display: flex; flex-direction: column; gap: 0.75rem; max-width: 720px; }
    .announcement-card {
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius); padding: 1.2rem 1.5rem;
      box-shadow: var(--shadow-sm); animation: fadeUp 0.3s ease;
    }
    .ann-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 0.6rem; }
    .ann-title  { font-family: var(--font-head); font-weight: 700; font-size: 0.95rem; color: var(--ink); }
    .ann-date   { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    .ann-msg    { font-size: 0.85rem; color: var(--ink2); line-height: 1.6; }
    .ann-by     { font-size: 0.75rem; color: var(--muted); margin-top: 0.6rem; }
  </style>
</head>
<body>
  <nav>
    <a href="dashboard.html" class="nav-logo"><div class="nav-logo-mark">SP</div>StudentPortal</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="courses.html" class="active">Courses</a>
      <a href="timetable.html">Timetable</a>
      <a href="attendance.html">Attendance</a>
    </div>
    <div class="nav-right">
      <a href="notifications.html" style="position:relative;text-decoration:none;padding:6px 10px;border-radius:var(--radius-sm);color:var(--muted);font-size:1.1rem;">🔔</a>
      <a href="profile.html" style="text-decoration:none;">
        <div class="nav-user">
          <div class="nav-avatar" id="navAvatar">S</div>
          <span class="nav-username" id="navName">Student</span>
        </div>
      </a>
      <button class="btn-logout" onclick="logout()">Log out</button>
    </div>
  </nav>

  <div class="container">
    <a href="courses.html" class="back-btn">← Back to Courses</a>

    <!-- Course Hero -->
    <div class="course-hero" id="courseHero">
      <div class="course-hero-left">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="content-tabs">
      <button class="content-tab active" onclick="switchTab('announcements', this)">
        📢 Announcements <span class="tab-badge" id="annCount">0</span>
      </button>
      <button class="content-tab" onclick="switchTab('syllabus', this)">
        📅 Syllabus <span class="tab-badge" id="sylCount">0</span>
      </button>
      <button class="content-tab" onclick="switchTab('materials', this)">
        📚 Materials <span class="tab-badge" id="matCount">0</span>
      </button>
    </div>

    <!-- Announcements -->
    <div class="content-section active" id="tab-announcements">
      <div class="announcements-list" id="announcementsList">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Syllabus -->
    <div class="content-section" id="tab-syllabus">
      <div class="syllabus-list" id="syllabusList">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Materials -->
    <div class="content-section" id="tab-materials">
      <div class="materials-grid" id="materialsList">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/content.js"></script>
  <script>
    requireAuth();

    // Get course ID from URL
    const params   = new URLSearchParams(window.location.search);
    const courseId = params.get("id");

    if (!courseId) window.location.href = "courses.html";

    async function init() {
      const user = await fetchUser();
      if (user) {
        const fn = user.name.split(" ")[0];
        document.getElementById("navName").textContent   = fn;
        document.getElementById("navAvatar").textContent = fn[0].toUpperCase();
      }
      await loadContent(courseId);
    }

    function switchTab(tab, btn) {
      document.querySelectorAll(".content-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".content-section").forEach(s => s.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`tab-${tab}`).classList.add("active");
    }

    init();
  </script>
</body>
</html>
